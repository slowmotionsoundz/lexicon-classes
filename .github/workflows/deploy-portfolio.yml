name: Deploy All Lexicon Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Project 4 Dashboard
        run: |
          cd project-4-dashboard
          npm ci
          npm run build

      - name: Build Project 3 Portfolio
        run: |
          cd project-3-portfolio
          npm ci
          npm run build

      - name: Assemble Combined Site
        run: |
          mkdir -p site

          # Root: Project 4 Developer Dashboard
          cp -R project-4-dashboard/dist/* site/

          # Project 1: CV Website
          mkdir -p site/project1-cv
          cp -R project1-cv/* site/project1-cv/

          # Project 2: Business Website
          mkdir -p site/project-2-business
          cp -R project-2-business/* site/project-2-business/

          # Project 3: Portfolio Hub
          mkdir -p site/project-3-portfolio
          cp -R project-3-portfolio/dist/* site/project-3-portfolio/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
